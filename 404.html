<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found · Austin 3D Explorer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
/* Every look value of this page is in this block (CLAUDE.md rule 11). It uses the same values as terms.html,
   so a visitor who mistypes a link stays inside the app's own look. */
:root{
  --bg:#140c04;                      /* the app's loading-screen dark */
  --ink:#f3e7d0;                     /* body text */
  --dim:rgba(243,231,208,.66);       /* the smaller line */
  --gold:#f5a623;                    /* the app's accent */
  --measure:30rem;
  --gutter:22px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:44px var(--gutter);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.62;color:var(--ink);background:var(--bg)}
main{max-width:var(--measure);width:100%}
.brand{display:block;font-size:12px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);text-decoration:none}
h1{font-size:30px;line-height:1.2;font-weight:650;margin:34px 0 10px}
p{color:var(--dim)}
a.go{display:inline-block;margin-top:26px;padding:11px 20px;border-radius:999px;background:var(--gold);color:#221604;font-weight:600;text-decoration:none}
a.go:focus-visible,.brand:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="brand" href="/">Austin 3D Explorer</a>
  <h1>Page not found</h1>
  <p>That link is old or mistyped. The map is still where you left it.</p>
  <a class="go" href="/">Back to the map</a>
</main>
</body>
</html>
