<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- AIR RACE (docs/air-race.md). A second page on the same repo: it draws the same city from the same files, so every
       map update reaches it with no sync step. index.html does not load anything from js/air/, air.css or data/air/.
       This script runs before any module parses its flags: it writes the few URL flags the shared modules already honour
       (the `f` table here, mirrored in js/air/params.js AIR.budget.flags), keeping the fragment (#g=... is a ghost link) and anything the visitor set. -->
  <script>(function () {
    var q = new URLSearchParams(location.search), f = { intro: '0', drift: '0', finder: '0', walk: '0', campuslandscape: '0', labels: '0', namelabels: '0' };
    for (var k in f) if (!q.has(k)) q.set(k, f[k]);
    try { history.replaceState(history.state, '', location.pathname + '?' + q.toString() + location.hash); } catch (e) {}
  })();</script>
  <title>Air Race</title>
  <meta name="description" content="Fly a glider through real Austin: rings between the real towers, a clock, and a ghost you can share by link." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/three@0.159.0/build/three.min.js" defer></script>
  <script src="js/tiles.js"></script>
  <script src="js/mobile.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="air.css" />
</head>
<body class="air">
  <div id="veil" aria-hidden="true">
    <div id="veil-mark">
      <svg viewBox="0 0 32 32" width="46" height="46" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="none" stroke="#f5a623" stroke-width="3"/><path d="M3 18 L29 14" stroke="#c9a06a" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div id="veil-title">Air Race</div>
    </div>
  </div>
  <div id="map"></div>
  <div id="sky"></div>
  <div id="vignette"></div>
  <!-- The shared time-of-day module wires this panel (js/timeofday.js initTimeOfDayUI). Kept for the sky; the game moves it. -->
  <div id="tod-panel">
    <span id="tod-sun" class="tod-mark" aria-hidden="true"></span>
    <div id="tod-slider-wrap"><input id="tod-slider" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Time of day" /></div>
    <span id="tod-moon" class="tod-mark" aria-hidden="true"></span>
    <button id="tod-play" title="Play the day/night cycle" aria-label="Play the day/night cycle">▶</button>
  </div>
  <div id="air-root"></div>

  <!-- The city, the same scripts in the same order as index.html, MINUS what cannot be read from the air at speed (the
       air budget, js/air/budget.js): name labels (name-labels.js), shop signs (signs.js, stubbed), street props (props.js),
       sculpture (arts.js), campus planting detail (campus-landscape.js), door and place layers (entrances.js, places.js),
       the walk, live-here and finder features (wayfind.js, live-here*.js, finder.js), the feedback box, analytics. -->
  <script src="js/loader.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/graphics.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/pattern-lowpass.js"></script>
  <script src="js/city-night.js"></script>
  <script src="js/city-lighting.js"></script>
  <script src="js/facades.js"></script>
  <script src="js/image-memory.js"></script>
  <script src="js/ground.js"></script>
  <script src="js/capitol.js"></script>
  <script src="js/union24.js"></script>
  <script src="js/roofs.js"></script>
  <script src="js/outer.js"></script>
  <script src="js/tower.js"></script>
  <script src="js/westcampus.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/moody.js"></script>
  <script src="js/heroes.js"></script>
  <script src="js/shadows.js"></script>
  <script src="js/timeofday.js"></script>
  <script src="js/night.js"></script>
  <script src="js/gpu-hint.js"></script>
  <script src="js/lod.js"></script>
  <script src="js/wall-patterns.js"></script>
  <script src="js/slopes.js"></script>
  <script src="js/geometry-memory-codec.js"></script>
  <script src="js/geometry-memory.js"></script>
  <script src="js/slopes-roofs.js"></script>
  <script src="js/slopes-arches.js"></script>
  <script src="js/slopes-dome.js"></script>
  <script src="js/facade-filter.js"></script>
  <script src="js/slopes-apartments.js"></script>
  <script src="js/slopes-art.js"></script>
  <script src="js/slopes-stadium.js"></script>
  <script src="js/outer-homes.js"></script>
  <script src="js/outer-trees.js"></script>

  <!-- Air Race: the budget (stubs for the modules left out, graphics overrides), then the game. js/air/game.js defines
       the global initControls() that js/app.js calls at its 'controls' step, in place of js/controls.js. -->
  <script src="js/air/params.js"></script>
  <script src="js/air/budget.js"></script>
  <script src="js/air/geo.js"></script>
  <script src="js/air/flight.js"></script>
  <script src="js/air/race.js"></script>
  <script src="js/air/ghost.js"></script>
  <script src="js/air/autopilot.js"></script>
  <script src="js/air/sim.js"></script>
  <script src="js/air/heights.js"></script>
  <script src="js/air/camera.js"></script>
  <script src="js/air/layer.js"></script>
  <script src="js/air/input.js"></script>
  <script src="js/air/ui.js"></script>
  <script src="js/air/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
