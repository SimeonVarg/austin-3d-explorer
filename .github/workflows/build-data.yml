name: Build Austin building data

# Phone-friendly: trigger this from Kiro / the GitHub mobile UI ("Run workflow").
# It runs the whole accuracy pipeline in the cloud and commits a dated snapshot
# back to the repo (data/snapshots/<date>/), so you never need a computer for the
# data step. A second refresh on the same UTC date replaces that date's snapshot.
# If a previous snapshot
# exists, it also computes a before/after diff for the change-animation feature.

on:
  workflow_dispatch:      # manual "Run workflow" button; select main
  push:
    branches: [main]
    paths:
      # Actual extraction/enrichment/detail/tiling inputs, not every bake.
      - "scripts/config.sh"
      - "scripts/extract.sh"
      - "scripts/extract_overture.sql"
      - "scripts/enrich.py"
      - "scripts/hero_overrides.json"
      - "scripts/tile.sh"
      - "scripts/bake_detail.py"
      - "scripts/diff_snapshots.py"
      - "scripts/update_manifest.py"
      - "scripts/bake_roof_anchors.py"
      - "data/parts.geojson"
      - "data/building_tags.geojson"
      - "data/hero_designs.json"
      - "data/signs.json"
      - "data/trees.geojson"
      - "data/roads.geojson"
      - "data/outer_ring.geojson"
      - "data/roofscape.geojson"
      - "data/roofscape.detail.geojson"
      - "data/props.geojson"
      # Generated snapshots/manifest/tiles/anchors are deliberately excluded.
      # Workflow-only edits can use workflow_dispatch for a deliberate refresh.

permissions:
  contents: write         # allow the action to commit the baked data

concurrency:
  group: city-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Dispatching from a feature branch must never publish its data.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Reject an outdated source revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::Main advanced since this run was requested. Refresh from current main."
            exit 1
          fi

      - name: Set snapshot date
        run: echo "SNAPSHOT_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Determine previous snapshot
        id: prev
        run: |
          if [ -f data/manifest.json ]; then
            prev=$(python3 -c "import json; print(json.load(open('data/manifest.json')).get('latest') or '')")
          else
            prev=""
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: |
          curl -L -o duckdb.zip https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git
          make -C tippecanoe -j"$(nproc)"
          sudo make -C tippecanoe install
          tippecanoe --version

      - name: Install Python deps
        run: pip install shapely

      - name: Extract Overture buildings
        run: bash scripts/extract.sh

      - name: Enrich (heights + OSM names + known-building corrections)
        run: |
          set -a; source scripts/config.sh; set +a
          python3 scripts/enrich.py

      - name: Build PMTiles
        run: bash scripts/tile.sh

      # THIS STEP IS LOAD-BEARING. buildings.detailed.geojson is what the front
      # end actually fetches; buildings.enriched.geojson is only an input to it.
      # Without this the snapshot is born dead — update_manifest.py refuses to
      # publish it (which is the fail-safe that has twice stopped a broken
      # `latest` reaching the live site), so the new data silently never appears.
      # That happened for both 2026-07-27 and 2026-07-30 before this step existed.
      - name: Bake render-ready detail (colours, parts, hero designs)
        run: python3 scripts/bake_detail.py "${{ env.SNAPSHOT_DATE }}"

      - name: Diff against previous snapshot
        if: steps.prev.outputs.prev != '' && steps.prev.outputs.prev != env.SNAPSHOT_DATE
        run: |
          mkdir -p data/diffs
          python3 scripts/diff_snapshots.py \
            "data/snapshots/${{ steps.prev.outputs.prev }}/buildings.enriched.geojson" \
            "data/snapshots/${{ env.SNAPSHOT_DATE }}/buildings.enriched.geojson" \
            "data/diffs/${{ steps.prev.outputs.prev }}_to_${{ env.SNAPSHOT_DATE }}.geojson"

      - name: Update manifest
        run: python3 scripts/update_manifest.py

      - name: Rebind roofscape to current wall heights
        run: python3 scripts/bake_roof_anchors.py

      - name: Commit baked data
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Never rebase old generated data onto newer sources or publications.
          current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::Main changed during the bake. Discard these results and refresh from current main."
            exit 1
          fi
          git config user.name  "austin-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Only this pipeline's outputs; never stage another bake's data.
          git add -- "data/snapshots/${SNAPSHOT_DATE}" data/manifest.json data/roof_anchors.json
          for layer in trees roads outer roofdetail props; do
            path="data/tiles/${layer}.pmtiles"
            if [ -f "$path" ]; then git add -- "$path"; fi
          done
          if [ -n "$PREVIOUS_SNAPSHOT" ] && [ "$PREVIOUS_SNAPSHOT" != "$SNAPSHOT_DATE" ]; then
            git add -- "data/diffs/${PREVIOUS_SNAPSHOT}_to_${SNAPSHOT_DATE}.geojson"
          fi
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Add ${SNAPSHOT_DATE} snapshot of Austin building data"
            # Explicit destination; a concurrent push after the check above
            # makes this ordinary fast-forward push fail rather than overwrite.
            git push origin HEAD:refs/heads/main
          fi
        env:
          PREVIOUS_SNAPSHOT: ${{ steps.prev.outputs.prev }}
