<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script>/* ?clip=1 = cinematic capture: scene only, no chrome (style.css .clip rules) */
    if (new URLSearchParams(location.search).get('clip') === '1') document.documentElement.classList.add('clip');</script>
  <title>Austin 3D Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23140c04'/%3E%3Crect x='5' y='15' width='7' height='12' fill='%23c9a06a'/%3E%3Crect x='13' y='6' width='7' height='21' fill='%23f5a623'/%3E%3Crect x='21' y='12' width='6' height='15' fill='%23b5522e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="veil" aria-hidden="true">
    <div id="veil-mark">
      <svg viewBox="0 0 32 32" width="46" height="46" aria-hidden="true"><rect x="5" y="15" width="7" height="12" fill="#c9a06a"/><rect x="13" y="6" width="7" height="21" fill="#f5a623"/><rect x="21" y="12" width="6" height="15" fill="#b5522e"/></svg>
      <div id="veil-title">Austin 3D Explorer</div>
    </div>
  </div>
  <div id="map"></div>
  <div id="sky"></div>
  <div id="vignette"></div>
  <div id="hud">
    <div id="hud-title">Austin 3D Explorer</div>
    <div id="hud-snapshot"></div>
  </div>
  <div id="controls-hint">
    <span class="desktop-hint">WASD move &nbsp;|&nbsp; drag to look &nbsp;|&nbsp; Q/E or wheel for altitude &nbsp;|&nbsp; Shift boost &nbsp;|&nbsp; R reset &nbsp;|&nbsp; P photo &nbsp;|&nbsp; T tour</span>
    <span class="mobile-hint">Joystick to move &nbsp;|&nbsp; swipe to look &nbsp;|&nbsp; two fingers for altitude</span>
  </div>

  <div id="debug-panel" class="hidden">
    <label class="toggle-label">
      <input type="checkbox" id="debug-toggle" />
      Color by height source
    </label>
    <div id="debug-legend" class="hidden">
      <span class="legend-dot" style="background:#4CAF50"></span> LiDAR
      <span class="legend-dot" style="background:#FF9800"></span> Estimated
      <span class="legend-dot" style="background:#9C27B0"></span> Override
    </div>
  </div>
  <div id="joystick-zone">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
  </div>
  <div id="tod-panel">
    <span id="tod-sun" aria-hidden="true">☀️</span>
    <div id="tod-slider-wrap">
      <input id="tod-slider" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Time of day" />
    </div>
    <span id="tod-moon" aria-hidden="true">🌙</span>
    <button id="tod-play" title="Auto day/night cycle">▶</button>
  </div>
  <!-- First, and before anything that can block: it owns the load screen. -->
  <script src="js/loader.js"></script>
  <script src="js/graphics.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/facades.js"></script>
  <script src="js/ground.js"></script>
  <script src="js/capitol.js"></script>
  <script src="js/union24.js"></script>
  <script src="js/props.js"></script>
  <!-- Both of these self-boot once loaded; app.js never calls them. Without
       these two lines the modules simply never run, and because _harness.html
       already had js/outer.js, the VERIFICATION HARNESS rendered the outer ring
       while the live site did not — the exact divergence _harness.html's own
       comment warns about. js/roofs.js was in neither file, so the roofscape's
       12,058 features were dead weight on both. Load after facades.js: outer.js
       waits on quantiseOuterFacades before it will add its layers. -->
  <script src="js/roofs.js"></script>
  <script src="js/outer.js"></script>
  <!-- The five parallel building passes (docs/FIVE_BUILDING_PASSES.md). These tags are
       committed AHEAD of the code so that no pass has to edit this file — six sessions
       editing one script list is a guaranteed conflict, and the opposite failure is the
       one three lines above. Each file is an empty IIFE until its pass lands. Loaded
       after facades.js and outer.js for the same reason outer.js is: they self-boot and
       wait on the facade atlas. KEEP IN SYNC WITH _harness.html. -->
  <script src="js/tower.js"></script>
  <script src="js/westcampus.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/arts.js"></script>
  <script src="js/moody.js"></script>
  <!-- Storefronts pass (docs/FOUR_MORE_PASSES.md), tag committed ahead of the code. -->
  <script src="js/places.js"></script>
  <script src="js/shadows.js"></script>
  <script src="js/timeofday.js"></script>
  <script src="js/signs.js"></script>
  <script src="js/night.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
