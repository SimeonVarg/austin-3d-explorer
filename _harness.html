<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script>/* ?clip=1 = cinematic capture: scene only, no chrome (style.css .clip rules).
       ?clip=1&drive=1 additionally keeps the joystick and BOOST (QUEUE Y10
       item 5). KEEP IN SYNC WITH index.html — this block is duplicated there
       and a harness that answers a URL flag differently from the site is the
       exact drift harness-drift.mjs exists to catch. */
    (function(){ var q = new URLSearchParams(location.search);
      if (q.get('clip') !== '1') return;
      document.documentElement.classList.add('clip');
      if (q.get('drive') === '1') document.documentElement.classList.add('clip-drive'); })();</script>
  <title>Austin 3D Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23140c04'/%3E%3Crect x='5' y='15' width='7' height='12' fill='%23c9a06a'/%3E%3Crect x='13' y='6' width='7' height='21' fill='%23f5a623'/%3E%3Crect x='21' y='12' width='6' height='15' fill='%23b5522e'/%3E%3C/svg%3E" />
  <script>/* HARNESS SHIM: preview tab is hidden, Chrome suspends rAF; drive frames with setTimeout so MapLibre renders */ window.requestAnimationFrame = function(cb){ return setTimeout(function(){ cb(performance.now()); }, 16); }; window.cancelAnimationFrame = clearTimeout; Object.defineProperty(document, "hidden", { get: function(){ return false; } }); Object.defineProperty(document, "visibilityState", { get: function(){ return "visible"; } });</script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <!-- Teaches MapLibre the pmtiles:// scheme. index.html has carried this since
       tiles landed; the harness did not, and js/tiles.js degrades QUIETLY when
       the global is absent ("pmtiles or maplibre not loaded - falling back to
       GeoJSON"), so TILES.on went false and EVERY tiled layer — trees, roads,
       props, roofdetail and the outer ring — served its GeoJSON fallback in
       every measurement any lane has ever taken through this page.
       e4883d1 ("Every pixel we have measured was of a city with no vector
       tiles") added js/tiles.js here and stopped one line short of the library
       it needs. harness-drift.mjs could not see the gap because its regex
       matched `js/...` sources only; it compares CDN scripts too now. -->
  <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>
  <!-- three.js, for js/slopes.js — the one layer in this app that is not
       fill-extrusion. r159 (MIT) is the last release that ships a plain-script
       build; r160 removed three.min.js, so a newer pin means an ES module.
       `defer`: it is not on the boot path (slopes.js waits for window.THREE)
       and 668 KB must not hold the city up. KEEP IN SYNC WITH _harness.html. -->
  <script src="https://unpkg.com/three@0.159.0/build/three.min.js" defer></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="veil" aria-hidden="true">
    <div id="veil-mark">
      <svg viewBox="0 0 32 32" width="46" height="46" aria-hidden="true"><rect x="5" y="15" width="7" height="12" fill="#c9a06a"/><rect x="13" y="6" width="7" height="21" fill="#f5a623"/><rect x="21" y="12" width="6" height="15" fill="#b5522e"/></svg>
      <div id="veil-title">Austin 3D Explorer</div>
    </div>
  </div>
  <div id="map"></div>
  <div id="sky"></div>
  <div id="vignette"></div>
  <div id="hud">
    <div id="hud-title">Austin 3D Explorer</div>
    <div id="hud-snapshot"></div>
  </div>
  <div id="controls-hint">
    <span class="desktop-hint">WASD move &nbsp;|&nbsp; drag to look &nbsp;|&nbsp; Q/E or wheel for altitude &nbsp;|&nbsp; Shift boost &nbsp;|&nbsp; R reset &nbsp;|&nbsp; P photo &nbsp;|&nbsp; T tour</span>
    <span class="mobile-hint">Joystick to move &nbsp;|&nbsp; BOOST to sprint &nbsp;|&nbsp; swipe to look &nbsp;|&nbsp; two fingers for altitude</span>
  </div>

  <div id="debug-panel" class="hidden">
    <label class="toggle-label">
      <input type="checkbox" id="debug-toggle" />
      Color by height source
    </label>
    <div id="debug-legend" class="hidden">
      <span class="legend-dot" style="background:#4CAF50"></span> LiDAR
      <span class="legend-dot" style="background:#FF9800"></span> Estimated
      <span class="legend-dot" style="background:#9C27B0"></span> Override
    </div>
  </div>
  <div id="joystick-zone">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
  </div>
  <!-- KEEP IN SYNC WITH index.html. The sun and moon were emoji; these are
       drawn marks that take their colour from the stylesheet, and the slider
       is a custom track whose gradient IS the day-to-night ramp. -->
  <div id="tod-panel">
    <span id="tod-sun" class="tod-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.2v2.7M12 19.1v2.7M2.2 12h2.7M19.1 12h2.7M5.05 5.05l1.9 1.9M17.05 17.05l1.9 1.9M18.95 5.05l-1.9 1.9M6.95 17.05l-1.9 1.9"/></svg></span>
    <div id="tod-slider-wrap">
      <input id="tod-slider" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Time of day" />
    </div>
    <span id="tod-moon" class="tod-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M20.8 14.1A8.6 8.6 0 0 1 9.9 3.2a8.9 8.9 0 1 0 10.9 10.9z"/></svg></span>
    <!-- Text glyph, deliberately: js/timeofday.js swaps this button's
         textContent between ▶ and ❚❚. -->
    <button id="tod-play" title="Play the day/night cycle" aria-label="Play the day/night cycle">▶</button>
  </div>
  <!-- BEFORE the Map hook, exactly as index.html has it at line 15: tiles.js
       registers the pmtiles:// protocol and scales the tile workers, and both
       have to happen before any Map is constructed. -->
  <script src="js/tiles.js"></script>
  <script>/* HARNESS: expose the map instance + keep the drawing buffer so we can pixel-sample our own output */ window.__HARNESS = true; (function(){ var RealMap = maplibregl.Map; function HookedMap(opts){ opts = opts || {}; opts.canvasContextAttributes = Object.assign({}, opts.canvasContextAttributes, { preserveDrawingBuffer: true }); var m = Reflect.construct(RealMap, [opts]); window.__map = m; return m; } HookedMap.prototype = RealMap.prototype; Object.setPrototypeOf(HookedMap, RealMap); maplibregl.Map = HookedMap; })();</script>
  <!-- First, and before anything that can block: it owns the load screen. -->
  <script src="js/loader.js"></script>
  <script src="js/graphics.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/pattern-lowpass.js"></script>
  <script src="js/facades.js"></script>
  <script src="js/ground.js"></script>
  <!-- KEEP IN SYNC WITH index.html. This list is a hand-maintained duplicate,
       and a module missing here renders a scene that looks correct and is not
       the one the site serves — capitol.js was added to index.html first and
       three shot runs "proved" the Capitol Complex had not changed. -->
  <script src="js/capitol.js"></script>
  <script src="js/props.js"></script>
  <script src="js/shadows.js"></script>
  <script src="js/timeofday.js"></script>
  <script src="js/signs.js"></script>
  <script src="js/night.js"></script>
  <!-- The recommendations box's delivery path (QUEUE I4): makes Send deliver
       via the visitor's mail app while js/graphics.js has no form endpoint.
       Self-booting; polls for the panel. KEEP IN SYNC WITH index.html. -->
  <script src="js/feedback.js"></script>
  <!-- Render distance (docs: js/lod.js header). Self-booting; needs the tag in
       BOTH files or the harness measures a scene the site does not serve. -->
  <script src="js/lod.js"></script>
  <!-- Real slopes (js/slopes.js header): the three.js custom layer. Self-
       booting off window.__map; ?slopes=0 leaves it out. After lod.js, which
       lists its layer id. KEEP IN SYNC WITH _harness.html. -->
  <script src="js/slopes.js"></script>
  <!-- Its three generators, each one shape from baked data (headers in each
       file): the roofs off the rig on roofs.geojson, the arches off the
       `arches` member on entrances.geojson, the dome lathed from its discs.
       Self-booting off window.slopes; ?slopes=0 leaves all three out. -->
  <script src="js/slopes-roofs.js"></script>
  <script src="js/slopes-arches.js"></script>
  <script src="js/slopes-dome.js"></script>
  <!-- Two more generators in the same layer (2026-09-05): the apartment
       buildings authored from sources in data/apartments/ (?apartments=0
       leaves them out; js/slopes-apartments.js header), and the campus art
       (js/slopes-art.js header). Self-booting off window.slopes like the
       three above. KEEP IN SYNC WITH _harness.html. -->
  <script src="js/slopes-apartments.js"></script>
  <script src="js/slopes-art.js"></script>
  <script src="js/controls.js"></script>
  <!-- These four bootstrap themselves off window.__map, so position in this list
       does not matter; anywhere before </body> works.

       KEEP THIS LIST IDENTICAL TO index.html. Every entry below was, at some
       point, in exactly one of the two files, and a harness that loads a
       different set of modules than the site measures a scene nobody can visit:
       the outer ring rendered here and not on the site, union24 rendered on the
       site and not here, and js/roofs.js — the roofscape's 12,058 features —
       was in neither, so it never ran anywhere at all. A verification harness
       is only worth its runtime if it loads what the site loads. -->
  <script src="js/roofs.js"></script>
  <script src="js/union24.js"></script>
  <script src="js/outer.js"></script>
  <!-- The five parallel building passes (docs/FIVE_BUILDING_PASSES.md). Committed ahead
       of the code so no pass has to edit this file. KEEP IN SYNC WITH index.html. -->
  <script src="js/tower.js"></script>
  <script src="js/westcampus.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/arts.js"></script>
  <script src="js/moody.js"></script>
  <!-- Campus heroes (QUEUE F4): EER, the Gates Dell Complex and the Norman
       Hackerman Building, all three of which arrive at a floor count times a
       2.8 m residential storey. Self-booting like arts.js; KEEP IN SYNC WITH
       index.html. -->
  <script src="js/heroes.js"></script>
  <!-- Storefronts pass (docs/FOUR_MORE_PASSES.md), tag committed ahead of the code. -->
  <script src="js/places.js"></script>
  <!-- Entrances (docs/entrances/*.md, scripts/bake_entrances.py). Self-booting
       off window.__map. KEEP IN SYNC WITH index.html. -->
  <script src="js/entrances.js"></script>
  <!-- Walk to class (docs/walk/*.md). Self-booting off window.__map like
       places.js. Returns on line one unless ?walk=1 / ?from= / ?to= is present,
       so a harness run that does not ask for it measures today's scene exactly.
       KEEP IN SYNC WITH index.html. -->
  <script src="js/wayfind.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
