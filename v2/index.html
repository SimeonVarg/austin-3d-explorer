<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>/* every path here is relative to /v2/: make sure the address ends in a slash */ if (!location.pathname.endsWith("/") && !/\.html$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Austin 3D Explorer</title>
  <meta name="description" content="Apartment hunting by the real walk to class, not the listing's &quot;5 min.&quot; West Campus, UT and downtown Austin in 3D.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script>/* The old app's modules (the finder, its schedule importer, live buses) fetch "data/..." and "js/..." relative to the old app's
     page, one folder up from here. Only those two bare relative forms are re-pointed; every v2 fetch uses a full URL. */
    (function () { var f = window.fetch.bind(window);
      window.fetch = function (u, o) { if (typeof u === 'string' && /^(data|js)\//.test(u)) u = '../' + u; return f(u, o); }; })();</script>
  <!-- the old app's stylesheets, unchanged: the loading screen, the schedule importer, the finder, the Explore menu.
       v2.css comes last and holds v2's own chrome. -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./loader.css">
  <link rel="stylesheet" href="../finder.css">
  <link rel="stylesheet" href="../explore.css">
  <link rel="stylesheet" href="./v2.css">
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
  } }
  </script>
</head>
<body>
  <!-- the first paint, until js/loader.js replaces it with the loading screen (the old app's, unchanged) -->
  <div id="veil" aria-hidden="true">
    <div id="veil-mark">
      <svg viewBox="0 0 32 32" width="46" height="46" aria-hidden="true"><rect x="5" y="15" width="7" height="12" fill="#c9a06a"/><rect x="13" y="6" width="7" height="21" fill="#f5a623"/><rect x="21" y="12" width="6" height="15" fill="#b5522e"/></svg>
      <div id="veil-title">Austin 3D Explorer</div>
    </div>
  </div>
  <canvas id="view"></canvas>
  <div id="markers" aria-hidden="false"></div>

  <div id="hud"><div id="hud-title">Austin 3D Explorer</div></div>

  <!-- a click on a building or a name: what it is (labels.js) -->
  <aside id="card" hidden aria-live="polite"></aside>

  <!-- v2's first walk planner, kept behind ?panel=1 (the finder replaces it) -->
  <section id="panel" aria-label="Plan a walk" hidden>
    <header>
      <h1>Walk to class</h1>
      <button id="fold" type="button" aria-expanded="true" aria-controls="panel-body" title="Fold the panel">&#8211;</button>
    </header>
    <div id="panel-body">
      <label>Apartment
        <select id="apt"><option value="">Loading…</option></select>
      </label>
      <label>Class building
        <select id="cls"><option value="">Loading…</option></select>
      </label>
      <div id="result" aria-live="polite"></div>
    </div>
  </section>

  <div id="status" aria-live="polite">Loading the city…</div>
  <footer id="credits"><a href="../terms.html" target="_blank" rel="noopener">Terms</a> | <a href="./credits.html" target="_blank" rel="noopener">Credits</a> | Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors<span class="wide">, <a href="./credits.html" target="_blank" rel="noopener">City of Austin</a> open data</span></footer>
  <noscript>This 3D map needs JavaScript and WebGL 2.</noscript>

  <!-- the loading screen: the old app's own file, driven by v2's real load (main.js, "loading screen") -->
  <script src="../js/loader.js"></script>
  <!-- the Explore menu (landmark arrivals): the old app's, through maplite.js -->
  <script src="../js/explore.js" defer></script>
  <!-- not run: js/finder.js finds the schedule importer's address from this tag, and loads it itself only when asked -->
  <script type="text/plain" src="../js/wayfind.js"></script>
  <!-- not run either: js/finder-live.js finds transit-live.js next to this tag's address -->
  <script type="text/plain" src="../js/finder.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
